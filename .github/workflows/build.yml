# 三平台自动构建：推 v* 标签即出 win/linux/macos 安装包并附到 GitHub Release；
# 也可手动触发（workflow_dispatch），产物进 Artifacts。
# 版本单源 script/version.yaml；win 本地构建走 script/build.bat。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^version:[[:space:]]*//p' script/version.yaml)" >> "$GITHUB_OUTPUT"

      - name: Sync version into package.jsons
        run: node script/sync-version.js

      - name: Build frontend
        run: cd frontend && npm ci && npm audit --audit-level=high --registry=https://registry.npmjs.org && npm run build

      - name: Embed dist into core
        shell: bash
        run: rm -rf core/web/dist && cp -r frontend/dist core/web/dist

      - name: Build core
        shell: bash
        run: |
          cd core
          mkdir -p ../release/dev
          go build -trimpath -ldflags "-s -w" -o ../release/dev/ezharness-core.exe .

      - name: Package desktop
        run: |
          cd desktop
          npm ci
          npm audit --audit-level=high --registry=https://registry.npmjs.org
          npx electron-builder ${{ matrix.target }} --publish never --config.directories.output=../release/v${{ steps.ver.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate checksums
        run: node script/checksums.js release/v${{ steps.ver.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezharness-v${{ steps.ver.outputs.version }}-${{ runner.os }}
          # 只传安装包与校验和：electron-builder 输出目录里还有 win-unpacked/、
          # mac/、linux-unpacked/ 等未打包目录（数百 MB），不能用 /* 通配
          path: |
            release/v${{ steps.ver.outputs.version }}/ezharness-v*-setup.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-v*.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-*.dmg
            release/v${{ steps.ver.outputs.version }}/ezharness-v*.AppImage
            release/v${{ steps.ver.outputs.version }}/SHA256SUMS-*.txt
          compression-level: 0

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/v${{ steps.ver.outputs.version }}/ezharness-v*-setup.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-v*.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-*.dmg
            release/v${{ steps.ver.outputs.version }}/ezharness-v*.AppImage
            release/v${{ steps.ver.outputs.version }}/SHA256SUMS-*.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
