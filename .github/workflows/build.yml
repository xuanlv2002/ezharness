# CI：普通 push / PR 只跑测试与默认登录冒烟；推 v* 标签或手动触发时再出
# win/linux/macos 安装包并附到 GitHub Release。
# 版本单源 script/version.yaml；win 本地构建走 script/build.bat。
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 先跑测试与默认登录冒烟；失败时三平台安装包不再构建/发布
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          # core 是 1.25.5，cli 是 1.26.0；取较高者
          go-version: '1.26'

      - name: Build frontend
        run: cd core/frontend && npm ci && npm run build

      - name: Embed dist into core
        run: rm -rf core/web/dist && cp -r core/frontend/dist core/web/dist

      - name: Test core
        run: cd core && go test ./... && go vet ./...

      - name: Test cli
        run: cd cli && go test ./... && go vet ./...

      - name: Build core for smoke
        run: cd core && mkdir -p ../release/dev && go build -o ../release/dev/ezharness-core.exe .

      - name: Smoke default login
        shell: bash
        run: |
          root="$RUNNER_TEMP/ezh-smoke"
          mkdir -p "$root"
          printf '{"port": 5391}\n' > "$root/ezharness.json"
          ./release/dev/ezharness-core.exe --root "$root" &
          core_pid=$!
          trap 'kill "$core_pid" 2>/dev/null || true' EXIT

          curl -sf --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:5391/api/app/health > /dev/null

          # 初始化端点已删除；默认密码是三端唯一入口，错密码必须 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:5391/api/auth/init)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"password":"wrong","client":"ci"}' \
            http://127.0.0.1:5391/api/auth/login)" = "401"

          token=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"password":"ezharness","client":"ci"}' \
            http://127.0.0.1:5391/api/auth/login \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -sf -H "EzHarnessToken: $token" \
            http://127.0.0.1:5391/api/auth/sessions \
            | grep -q '"name":"ci"'

          # 没有默认令牌；需要时在会话面生成一枚
          test ! -e "$root/data/openapi.json"
          openapi_token=$(curl -sf -X POST \
            -H "EzHarnessToken: $token" -H 'Content-Type: application/json' \
            -d '{"name":"ci"}' \
            http://127.0.0.1:5391/api/security/openapi-tokens \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"]["token"])')
          curl -sf -H "EzHarnessOpenToken: $openapi_token" \
            http://127.0.0.1:5391/api/open/mcp > /dev/null
          # OpenAPI 与登录态独立：会话头调 open 面必须 401，会话面正常
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H "EzHarnessToken: $token" \
            http://127.0.0.1:5391/api/open/mcp)" = "401"
          curl -sf -H "EzHarnessToken: $token" \
            http://127.0.0.1:5391/api/media/jobs > /dev/null

  build:
    needs: test
    # 安装包只在发版标签/手动触发时构建；普通 push 与 PR 停在 test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          # core 是 1.25.5，cli 是 1.26.0；取较高者
          go-version: '1.26'

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^version:[[:space:]]*//p' script/version.yaml)" >> "$GITHUB_OUTPUT"

      - name: Sync version into package.jsons
        run: node script/sync-version.js

      - name: Build frontend
        run: cd core/frontend && npm ci && npm audit --audit-level=high --registry=https://registry.npmjs.org && npm run build

      - name: Embed dist into core
        shell: bash
        run: rm -rf core/web/dist && cp -r core/frontend/dist core/web/dist

      - name: Build core
        shell: bash
        run: |
          cd core
          mkdir -p ../release/dev
          go build -trimpath -ldflags "-s -w -X ezharness/core/internal/config.Version=${{ steps.ver.outputs.version }}" -o ../release/dev/ezharness-core.exe .

      - name: Build cli
        shell: bash
        run: |
          cd cli
          # 只产出 release/dev/ezharness.exe：desktop 的 extraFiles 按名取，
          # 随安装包一起分发，不单独发布裸二进制
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o ../release/dev/ezharness.exe .

      - name: Package desktop
        run: |
          cd desktop
          npm ci
          npm audit --audit-level=high --registry=https://registry.npmjs.org
          npx electron-builder ${{ matrix.target }} --publish never --config.directories.output=../release/v${{ steps.ver.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate checksums
        run: node script/checksums.js release/v${{ steps.ver.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezharness-v${{ steps.ver.outputs.version }}-${{ runner.os }}
          # 只传三平台安装包与校验和：electron-builder 输出目录里还有
          # win-unpacked/、mac/、linux-unpacked/ 等未打包目录（数百 MB），
          # 不能用 /* 通配
          path: |
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*-setup.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-*.dmg
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*.AppImage
            release/v${{ steps.ver.outputs.version }}/SHA256SUMS-*.txt
          compression-level: 0

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*-setup.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-*.dmg
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*.AppImage
            release/v${{ steps.ver.outputs.version }}/SHA256SUMS-*.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
