# 三平台自动构建：推 v* 标签即出 win/linux/macos 安装包并附到 GitHub Release；
# 也可手动触发（workflow_dispatch），产物进 Artifacts。
# 版本单源 script/version.yaml；win 本地构建走 script/build.bat。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          # core 是 1.25.5，cli 依赖的 x/term 要求 1.26；取两者较高者，避免构建时再下载工具链
          go-version: '1.26'

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(sed -n 's/^version:[[:space:]]*//p' script/version.yaml)" >> "$GITHUB_OUTPUT"

      - name: Sync version into package.jsons
        run: node script/sync-version.js

      - name: Build frontend
        run: cd core/frontend && npm ci && npm audit --audit-level=high --registry=https://registry.npmjs.org && npm run build

      - name: Embed dist into core
        shell: bash
        run: rm -rf core/web/dist && cp -r core/frontend/dist core/web/dist

      - name: Build core
        shell: bash
        run: |
          cd core
          mkdir -p ../release/dev
          go build -trimpath -ldflags "-s -w -X ezharness/core/internal/config.Version=${{ steps.ver.outputs.version }}" -o ../release/dev/ezharness-core.exe .

      - name: Build cli
        shell: bash
        run: |
          cd cli
          # 打包用产物三平台同名 ezharness.exe（desktop 的 extraFiles 按名取）；
          # 另拷一份平台原生名的直接下载入口。core 也拷一份同目录发布——
          # linux/mac 没有安装包时，CLI 靠 exe 同目录的 core 才能自己拉起实例。
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o ../release/dev/ezharness.exe .
          mkdir -p "../release/v${{ steps.ver.outputs.version }}"
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp ../release/dev/ezharness.exe "../release/v${{ steps.ver.outputs.version }}/ezharness${ext}"
          cp ../release/dev/ezharness-core.exe "../release/v${{ steps.ver.outputs.version }}/ezharness-core${ext}"

      - name: Package desktop
        run: |
          cd desktop
          npm ci
          npm audit --audit-level=high --registry=https://registry.npmjs.org
          npx electron-builder ${{ matrix.target }} --publish never --config.directories.output=../release/v${{ steps.ver.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate checksums
        run: node script/checksums.js release/v${{ steps.ver.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezharness-v${{ steps.ver.outputs.version }}-${{ runner.os }}
          # 只传安装包与校验和：electron-builder 输出目录里还有 win-unpacked/、
          # mac/、linux-unpacked/ 等未打包目录（数百 MB），不能用 /* 通配
          path: |
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*-setup.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-*.dmg
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*.AppImage
            release/v${{ steps.ver.outputs.version }}/ezharness
            release/v${{ steps.ver.outputs.version }}/ezharness.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-core
            release/v${{ steps.ver.outputs.version }}/ezharness-core.exe
            release/v${{ steps.ver.outputs.version }}/SHA256SUMS-*.txt
          compression-level: 0

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*-setup.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-*.dmg
            release/v${{ steps.ver.outputs.version }}/ezharness-desktop-v*.AppImage
            release/v${{ steps.ver.outputs.version }}/ezharness
            release/v${{ steps.ver.outputs.version }}/ezharness.exe
            release/v${{ steps.ver.outputs.version }}/ezharness-core
            release/v${{ steps.ver.outputs.version }}/ezharness-core.exe
            release/v${{ steps.ver.outputs.version }}/SHA256SUMS-*.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
