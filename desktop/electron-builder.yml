# ezharness desktop 打包配置：win NSIS+绿色版 / mac dmg / linux AppImage，内嵌 core exe
# 本地构建走 script/build.bat（win）；三平台自动构建走 .github/workflows/build.yml
appId: com.ezharness.desktop
productName: ezharness
directories:
  output: ../release
files:
  - src/**
  - package.json
# core 打进 resources/（产物统一命名 ezharness-core.exe，三平台一致——spawn 与打包都认）。
# 配置与数据不放安装目录（升级/卸载会整目录删除）：开发态在 release/dev/，
# 便携版在 exe 同目录，安装版在系统用户数据目录（见 desktop/src/main/index.js rootDir）
extraResources:
  - from: ../release/dev/ezharness-core.exe
    to: ezharness-core.exe
  - from: ../assets/icon.png
    to: icon.png
win:
  target:
    - nsis
    - portable
  # 图标用默认约定位置 desktop/build/icon.png（越出项目目录的路径 app-builder 不识别，会静默回落 Electron 默认图标）
nsis:
  # 升级前把旧版放在安装目录里的配置与数据预拷到用户数据目录
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ezharness-v${version}-setup.exe
portable:
  artifactName: ezharness-v${version}.exe
mac:
  target:
    - dmg
  category: public.app-category.productivity
  # 无 Apple 开发者证书：强制 ad-hoc 签名，避免 macOS 把未签名包判为「已损坏」
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - AppImage
  category: Utility
  artifactName: ezharness-v${version}.AppImage
