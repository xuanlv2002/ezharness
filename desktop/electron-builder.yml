# ezharness desktop 打包配置：win NSIS / mac dmg / linux AppImage（三平台安装包）。
# 本地构建走 script/build.bat（win）；三平台自动构建走 .github/workflows/build.yml。
appId: com.ezharness.desktop
productName: ezharness
# 桌面端 exe 名：安装目录里三 exe 并排（ezharness.exe 是 CLI），productName
# 不动——它决定 userData 目录名，改了会丢老数据与密码。executableName 会被
# electron-builder 当作安装目录名，装机脚本里已覆盖回 ezharness（installer.nsh）
executableName: ezharness-desktop
directories:
  output: ../release
files:
  - src/**
  - package.json
# 三 exe 同放应用 exe 旁（extraFiles 落安装根目录，PATH 一条目录直达）；
# tray 图标仍走 resources/。配置与数据不放安装目录（升级/卸载会整目录
# 删除）：开发态在 release/dev/，安装版在系统用户数据目录（见
# desktop/src/main/index.js rootDir）
extraFiles:
  - from: ../release/dev/ezharness-core.exe
    to: ezharness-core.exe
  - from: ../release/dev/ezharness.exe
    to: ezharness.exe
extraResources:
  - from: ../assets/icon.png
    to: icon.png
win:
  target:
    - nsis
  # 图标用默认约定位置 desktop/build/icon.png（越出项目目录的路径 app-builder 不识别，会静默回落 Electron 默认图标）
nsis:
  # 装机时勾选（默认勾选）把安装目录写进 HKLM 系统 PATH——所有用户任意
  # 终端直达 ezharness 命令（见 build/installer.nsh）
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  artifactName: ezharness-desktop-v${version}-setup.exe
mac:
  target:
    - dmg
  category: public.app-category.productivity
  # 无 Apple 开发者证书：强制 ad-hoc 签名，避免 macOS 把未签名包判为「已损坏」
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - AppImage
  category: Utility
  artifactName: ezharness-desktop-v${version}.AppImage
