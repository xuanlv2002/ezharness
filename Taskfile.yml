version: '3'

# 三层构建：frontend（Svelte 双入口）→ core（Go sidecar，内嵌前端产物）
# → desktop（Electron 壳，electron-builder 打包）

tasks:
  build:frontend:
    summary: 前端构建（index.html 主应用 + browser.html 浏览器窗口页）
    dir: frontend
    cmds:
      - npm run build

  build:core:
    summary: 同步前端产物到 core/dist 并构建 ezharness-core.exe（exe 所在目录=配置与数据目录）
    deps: [build:frontend]
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force core/dist -ErrorAction SilentlyContinue; Copy-Item -Recurse frontend/dist core/dist"
        platforms: [windows]
      - go build -o ezharness-core.exe ./core

  build:
    summary: 全量构建（前端 + core）
    cmds:
      - task: build:core

  dev:
    summary: 开发模式（vite 热更 + Electron 壳；core 用已构建 exe，无则先构建）
    cmds:
      - cmd: if not exist ezharness-core.exe ( task build:core )
        platforms: [windows]
      - cmd: start "ezharness vite" cmd /c "cd frontend && npm run dev"
        platforms: [windows]
      - cmd: timeout /t 3 /nobreak >nul && cd desktop && set EZHARNESS_DEV_URL=http://localhost:5173&& npx electron .
        platforms: [windows]

  package:
    summary: 发布打包（electron-builder 出 NSIS 安装包，内嵌 core exe）
    deps: [build:core]
    dir: desktop
    cmds:
      - npx electron-builder --win
